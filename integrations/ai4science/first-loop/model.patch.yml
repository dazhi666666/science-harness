# Real OpenAI-compatible model route. The credential is supplied through the existing host seam.
- id: llm-pi-ai
  config:
    providers:
      stepfun-science:
        api: openai-completions
        baseURL: https://api.stepfun.com/step_plan/v1
        apiKeyEnv: AI4S_STEPFUN_API_KEY
        retryPolicy:
          mode: normal
          maxRetries: 3
          backoff:
            initialDelayMs: 5000
            maxDelayMs: 20000
            jitterRatio: 0
        timeoutMs: 120000
        streamIdleTimeoutMs: 120000
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          maxTokensField: max_tokens
        models:
          - id: step-3.7-flash
            name: step-3.7-flash
            contextWindow: 65536
            maxTokens: 8192
- id: agent-default-model
  config:
    provider: stepfun-science
    model: step-3.7-flash
- id: session-title-llm
  disabled: true
- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_HOME + '/sessions'
    compression: none
