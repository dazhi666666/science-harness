name: AI4Science

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai4science-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'
      - name: Install source dependencies and declarations
        run: python3 integrations/ai4science/platform/setup.py
      - name: Infrastructure and retained regressions
        run: python3 integrations/ai4science/platform/check.py --output .ai4science/check
      - name: Independently installed external execution
        run: python3 integrations/ai4science/external-job/check.py --output .ai4science/external-check
      - name: Retain deterministic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai4science-check
          path: |
            .ai4science/check
            .ai4science/external-check
          if-no-files-found: warn
